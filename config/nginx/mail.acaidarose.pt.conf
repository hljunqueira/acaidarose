server {
    listen 80;
    server_name mail.acaidarose.pt autoconfig.acaidarose.pt autodiscover.acaidarose.pt;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mail.acaidarose.pt autoconfig.acaidarose.pt autodiscover.acaidarose.pt;
    http2 on;

    ssl_certificate /www/sites/mail.acaidarose.pt/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/mail.acaidarose.pt/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Suporte a anexos de até 100MB (compatível com o limite de 75MB do Roundcube + overhead Base64)
    client_max_body_size 100m;
    client_body_buffer_size 512k;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts estendidos para conexões móveis lentas (4G)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Evita cabeçalhos duplicados conflitantes (sameorigin, SAMEORIGIN) que quebram o iframe do Roundcube no Chrome/Android
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;

        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
    }
}
