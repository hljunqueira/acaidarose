server {
    listen 80;
    server_name api.acaidarose.pt;

    client_max_body_size 50M;

    location = / {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers * always;
        return 200 '{"service":"Açaí da Rose API Gateway","status":"online","version":"1.0.0","docs":"https://acaidarose.pt","message":"Açaí da Rose REST API Gateway. Endpoints disponíveis em /api/*","timestamp":"$time_iso8601"}';
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /www/sites/acaidarose.pt/log/api_access.log icp_json;
    error_log /www/sites/acaidarose.pt/log/api_error.log;
}
