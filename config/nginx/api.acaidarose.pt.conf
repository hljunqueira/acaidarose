server {
    listen 80;
    server_name api.acaidarose.pt;

    location = / {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers * always;
        return 200 '{"service":"Açaí da Rose API Gateway","status":"online","version":"1.0.0","docs":"https://acaidarose.pt","message":"Açaí da Rose REST API Gateway. Endpoints disponíveis em /api/*","timestamp":"$time_iso8601"}';
    }

    location / {
        proxy_pass https://acaidarose.vercel.app;
        proxy_set_header Host acaidarose.vercel.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    access_log /www/sites/acaidarose.pt/log/api_access.log icp_json;
    error_log /www/sites/acaidarose.pt/log/api_error.log;
}
